name: Dnevni cjenik
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: cjenik
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate_cjenik.py
      - name: Commit
        run: |
          git config user.name "cjenik-bot"
          git config user.email "cjenik-bot@users.noreply.github.com"
          git add -A
          git commit -m "Cjenik $(TZ=Europe/Zagreb date +'%d.%m.%Y %H:%M')" || echo "Nema promjena"
          git push
